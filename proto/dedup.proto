syntax = "proto3";

package dedup;

option go_package = "s3-dedup-engine/services/gateway/pb";

service SimilarityService {
  rpc CheckSimilarity(SimilarityRequest) returns (SimilarityResponse);
}

message SimilarityRequest {
  bytes image = 1;
  bytes reference_image = 2;
  string file_name = 3;
}

message SimilarityResponse {
  float similarity_score = 1;
}
